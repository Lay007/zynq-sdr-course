name: Block 8 OFDM RTL

on:
  push:
    branches: [ main ]
    paths:
      - "blocks/block_08_modulation_and_synchronization/rtl/ofdm_*.v"
      - "blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_*.sv"
      - "verification/vectors/block08_ofdm_*.mem"
      - ".github/workflows/block8_ofdm_rtl.yml"
  pull_request:
    paths:
      - "blocks/block_08_modulation_and_synchronization/rtl/ofdm_*.v"
      - "blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_*.sv"
      - "verification/vectors/block08_ofdm_*.mem"
      - ".github/workflows/block8_ofdm_rtl.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ofdm-rtl-smoke:
    name: OFDM RTL self-checking regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V

      - name: Compile and run OFDM QPSK mapper regression
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall \
            -s tb_ofdm_qpsk_mapper \
            -o /tmp/tb_ofdm_qpsk_mapper.vvp \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_qpsk_mapper.v \
            blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_qpsk_mapper.sv
          vvp /tmp/tb_ofdm_qpsk_mapper.vvp

      - name: Compile and run OFDM subcarrier allocator regression
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall \
            -s tb_ofdm_subcarrier_allocator \
            -o /tmp/tb_ofdm_subcarrier_allocator.vvp \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_subcarrier_allocator.v \
            blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_subcarrier_allocator.sv
          vvp /tmp/tb_ofdm_subcarrier_allocator.vvp

      - name: Compile and run OFDM IFFT butterfly regression
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall \
            -s tb_ofdm_ifft_butterfly \
            -o /tmp/tb_ofdm_ifft_butterfly.vvp \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_ifft_butterfly.v \
            blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_ifft_butterfly.sv
          vvp /tmp/tb_ofdm_ifft_butterfly.vvp

      - name: Compile and run sequential OFDM IFFT regression
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall \
            -s tb_ofdm_ifft64_sequential \
            -o /tmp/tb_ofdm_ifft64_sequential.vvp \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_ifft_butterfly.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_ifft64_sequential.v \
            blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_ifft64_sequential.sv
          vvp /tmp/tb_ofdm_ifft64_sequential.vvp

      - name: Compile and run OFDM cyclic-prefix regression
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall \
            -s tb_ofdm_cp16_inserter \
            -o /tmp/tb_ofdm_cp16_inserter.vvp \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_cp16_inserter.v \
            blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_cp16_inserter.sv
          vvp /tmp/tb_ofdm_cp16_inserter.vvp

      - name: Compile and run mapped OFDM TX path regression
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall \
            -s tb_ofdm_tx_mapper_ifft_path \
            -o /tmp/tb_ofdm_tx_mapper_ifft_path.vvp \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_qpsk_mapper.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_subcarrier_allocator.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_ifft_butterfly.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_ifft64_sequential.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_tx_mapper_ifft_path.v \
            blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_tx_mapper_ifft_path.sv
          vvp /tmp/tb_ofdm_tx_mapper_ifft_path.vvp

      - name: Compile and run complete OFDM TX CP16 regression
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall \
            -s tb_ofdm_tx_cp16_path \
            -o /tmp/tb_ofdm_tx_cp16_path.vvp \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_qpsk_mapper.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_subcarrier_allocator.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_ifft_butterfly.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_ifft64_sequential.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_tx_mapper_ifft_path.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_cp16_inserter.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_tx_cp16_path.v \
            blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_tx_cp16_path.sv
          vvp /tmp/tb_ofdm_tx_cp16_path.vvp
