name: Block 8 CSS RTL

on:
  push:
    branches: [ main ]
    paths:
      - "blocks/block_08_modulation_and_synchronization/rtl/**"
      - "blocks/block_08_modulation_and_synchronization/tb/**"
      - "blocks/block_08_modulation_and_synchronization/python/css_sf7_fixed_ref.py"
      - "blocks/block_08_modulation_and_synchronization/python/generate_css_sf7_detector_vectors.py"
      - "tools/run_block8_css_rtl.py"
      - ".github/workflows/block8_css_rtl.yml"
  pull_request:
    paths:
      - "blocks/block_08_modulation_and_synchronization/rtl/**"
      - "blocks/block_08_modulation_and_synchronization/tb/**"
      - "blocks/block_08_modulation_and_synchronization/python/css_sf7_fixed_ref.py"
      - "blocks/block_08_modulation_and_synchronization/python/generate_css_sf7_detector_vectors.py"
      - "tools/run_block8_css_rtl.py"
      - ".github/workflows/block8_css_rtl.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  css-rtl-smoke:
    name: CSS RTL self-checking regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V

      - name: Generate vectors and run CSS RTL regressions
        run: python tools/run_block8_css_rtl.py
