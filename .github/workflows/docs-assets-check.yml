name: Docs Assets Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-assets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-assets-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check local Markdown assets
        run: python tools/check_markdown_assets.py

      - name: Check lab navigation coverage
        run: python tools/check_lab_navigation.py

      - name: Check canonical lab ID ownership
        run: python tools/check_lab_id_registry.py
