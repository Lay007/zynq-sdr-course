name: Python Quality

on:
  push:
    branches: [ main ]
    paths:
      - "blocks/**"
      - "tools/**"
      - "practice/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/python_quality.yml"
  pull_request:
    paths:
      - "blocks/**"
      - "tools/**"
      - "practice/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/python_quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff and pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff
        run: python -m ruff check blocks tools tests

      - name: Lint optional practice exercises
        run: |
          if [ -d practice ]; then
            python -m ruff check practice
          fi

      - name: Run pytest
        run: python -m pytest -q
