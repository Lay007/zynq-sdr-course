name: Block 5 HDL

on:
  push:
    branches: [ main ]
    paths:
      - "blocks/block_05_fpga_hdl_flow/**"
      - "hardware/7020_ad936x_sdr/hdl/course_bpsk_fmcomms2_zc702/*.v"
      - "tools/run_block5_hdl_smoke.sh"
      - "tools/run_block5_hdl_smoke.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/block5_hdl.yml"
  pull_request:
    paths:
      - "blocks/block_05_fpga_hdl_flow/**"
      - "hardware/7020_ad936x_sdr/hdl/course_bpsk_fmcomms2_zc702/*.v"
      - "tools/run_block5_hdl_smoke.sh"
      - "tools/run_block5_hdl_smoke.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/block5_hdl.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iverilog-sim:
    name: Run Icarus Verilog simulations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run Block 5 HDL smoke suite
        shell: bash
        run: bash tools/run_block5_hdl_smoke.sh --artifacts-dir build/hdl/block5

      - name: Upload VCD waveforms
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: block5-hdl-waveforms
          path: build/hdl/block5/
          if-no-files-found: warn
