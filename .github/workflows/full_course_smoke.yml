name: Full Course Smoke

on:
  push:
    branches: [ main ]
    paths:
      - "blocks/**"
      - "docs/**"
      - "tools/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/full_course_smoke.yml"
  pull_request:
    paths:
      - "blocks/**"
      - "docs/**"
      - "tools/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/full_course_smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-course-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build docs and run representative labs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build MkDocs site in strict mode
        run: |
          mkdocs build --strict

      - name: Run representative executable labs
        run: |
          python tools/run_all_labs.py

      - name: Run Block 5 HDL smoke suite
        shell: bash
        run: bash tools/run_block5_hdl_smoke.sh

      - name: Validate summary artifacts
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            docs/assets/course_reproducibility_summary.json
            docs/assets/course_reproducibility_summary.md
          )
          for file in "${expected[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing or empty summary artifact: $file"
              exit 1
            fi
            echo "OK: $file"
          done

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v7
        with:
          name: full-course-smoke-artifacts
          path: |
            docs/assets/course_reproducibility_summary.json
            docs/assets/course_reproducibility_summary.md
            docs/assets/lab64_synthetic_rf_capture_fft.png
            docs/assets/lab73_tx_rx_loopback_spectrum.png
            docs/assets/lab84_sync_constellation_final.png
            docs/assets/lab93_multiformat_iq_metrics.json
          if-no-files-found: warn
