name: Block 8 OFDM RX Chain

on:
  push:
    branches: [ main ]
    paths:
      - "blocks/block_08_modulation_and_synchronization/rtl/ofdm_*.v"
      - "blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_*.sv"
      - "verification/vectors/block08_ofdm_pilot_tracker_vectors.txt"
      - "verification/vectors/block08_ofdm_channel_eq_vectors.txt"
      - "verification/vectors/block08_ofdm_channel_eq_norm_vectors.txt"
      - "verification/vectors/block08_ofdm_cfo_vectors.txt"
      - ".github/workflows/block8_ofdm_rx_chain.yml"
  pull_request:
    paths:
      - "blocks/block_08_modulation_and_synchronization/rtl/ofdm_*.v"
      - "blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_*.sv"
      - "verification/vectors/block08_ofdm_pilot_tracker_vectors.txt"
      - "verification/vectors/block08_ofdm_channel_eq_vectors.txt"
      - "verification/vectors/block08_ofdm_channel_eq_norm_vectors.txt"
      - "verification/vectors/block08_ofdm_cfo_vectors.txt"
      - ".github/workflows/block8_ofdm_rx_chain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rx-chain:
    name: OFDM RX chain self-checking regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V

      - name: Check subcarrier extractor
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall \
            -s tb_ofdm_subcarrier_extractor \
            -o /tmp/tb_ofdm_subcarrier_extractor.vvp \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_subcarrier_extractor.v \
            blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_subcarrier_extractor.sv
          vvp /tmp/tb_ofdm_subcarrier_extractor.vvp

      - name: Check one-tap equalizer
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall \
            -s tb_ofdm_one_tap_equalizer \
            -o /tmp/tb_ofdm_one_tap_equalizer.vvp \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_one_tap_equalizer.v \
            blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_one_tap_equalizer.sv
          vvp /tmp/tb_ofdm_one_tap_equalizer.vvp

      - name: Check pipelined one-tap equalizer
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall \
            -s tb_ofdm_one_tap_equalizer \
            -Ptb_ofdm_one_tap_equalizer.PIPELINED=1 \
            -o /tmp/tb_ofdm_one_tap_equalizer_pipelined.vvp \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_one_tap_equalizer.v \
            blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_one_tap_equalizer.sv
          vvp /tmp/tb_ofdm_one_tap_equalizer_pipelined.vvp

      - name: Check pilot phase tracker
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall \
            -s tb_ofdm_pilot_phase_tracker \
            -o /tmp/tb_ofdm_pilot_phase_tracker.vvp \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_pilot_phase_tracker.v \
            blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_pilot_phase_tracker.sv
          vvp /tmp/tb_ofdm_pilot_phase_tracker.vvp

      - name: Check QPSK demapper
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall \
            -s tb_ofdm_qpsk_demapper \
            -o /tmp/tb_ofdm_qpsk_demapper.vvp \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_qpsk_demapper.v \
            blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_qpsk_demapper.sv
          vvp /tmp/tb_ofdm_qpsk_demapper.vvp

      - name: Check complete OFDM TX to RX digital loopback
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall \
            -s tb_ofdm_tx_rx_digital_loopback \
            -o /tmp/tb_ofdm_tx_rx_digital_loopback.vvp \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_qpsk_mapper.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_subcarrier_allocator.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_ifft_butterfly.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_ifft64_sequential.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_iq_bank_ram.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_tx_mapper_ifft_path.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_cp16_inserter.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_tx_cp16_path.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_cp16_remover.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_fft64_sequential.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_subcarrier_extractor.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_qpsk_demapper.v \
            blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_tx_rx_digital_loopback.sv
          vvp /tmp/tb_ofdm_tx_rx_digital_loopback.vvp

      - name: Check OFDM flat-channel equalized loopback
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall \
            -s tb_ofdm_tx_rx_equalized_loopback \
            -o /tmp/tb_ofdm_tx_rx_equalized_loopback.vvp \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_qpsk_mapper.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_subcarrier_allocator.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_ifft_butterfly.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_ifft64_sequential.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_iq_bank_ram.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_tx_mapper_ifft_path.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_cp16_inserter.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_tx_cp16_path.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_cp16_remover.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_fft64_sequential.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_subcarrier_extractor.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_one_tap_equalizer.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_qpsk_demapper.v \
            blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_tx_rx_equalized_loopback.sv
          vvp /tmp/tb_ofdm_tx_rx_equalized_loopback.vvp

      - name: Check pilot-corrected TX->RX loopback (120 and -150 degree channels)
        run: |
          set -euo pipefail
          for angle in 120 -150; do
            iverilog -g2012 -Wall \
              -s tb_ofdm_tx_rx_pilot_corrected_loopback \
              -Ptb_ofdm_tx_rx_pilot_corrected_loopback.ANGLE_DEG=$angle \
              -o /tmp/tb_ofdm_tx_rx_pilot_corrected_loopback.vvp \
              blocks/block_08_modulation_and_synchronization/rtl/ofdm_*.v \
              blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_tx_rx_pilot_corrected_loopback.sv
            vvp /tmp/tb_ofdm_tx_rx_pilot_corrected_loopback.vvp
          done

      - name: Check pilot-corrected loopback under a 2000 ppm CFO (8 symbols)
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall \
            -s tb_ofdm_tx_rx_pilot_corrected_loopback \
            -Ptb_ofdm_tx_rx_pilot_corrected_loopback.ANGLE_DEG=30 \
            -Ptb_ofdm_tx_rx_pilot_corrected_loopback.CFO_PPM=2000 \
            -Ptb_ofdm_tx_rx_pilot_corrected_loopback.SYMBOLS=8 \
            -o /tmp/tb_ofdm_cfo.vvp \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_*.v \
            blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_tx_rx_pilot_corrected_loopback.sv
          vvp /tmp/tb_ofdm_cfo.vvp

      - name: Check per-subcarrier channel equalizer against the fixed-point vectors
        run: |
          set -euo pipefail
          for normalize in 0 1; do
            iverilog -g2012 -Wall \
              -s tb_ofdm_channel_equalizer \
              -Ptb_ofdm_channel_equalizer.NORMALIZE=$normalize \
              -o /tmp/tb_ofdm_channel_equalizer.vvp \
              blocks/block_08_modulation_and_synchronization/rtl/ofdm_channel_equalizer.v \
              blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_channel_equalizer.sv
            vvp /tmp/tb_ofdm_channel_equalizer.vvp
          done

      - name: Check 3-path channel loopback (phase-only and zero-forcing, with and without a 2000 ppm CFO)
        run: |
          set -euo pipefail
          for case in "0 0" "0 2000" "1 0" "1 2000"; do
            set -- $case
            iverilog -g2012 -Wall \
              -s tb_ofdm_tx_rx_multipath_loopback \
              -Ptb_ofdm_tx_rx_multipath_loopback.NORMALIZE=$1 \
              -Ptb_ofdm_tx_rx_multipath_loopback.CFO_PPM=$2 \
              -Ptb_ofdm_tx_rx_multipath_loopback.SYMBOLS=8 \
              -o /tmp/tb_ofdm_multipath.vvp \
              blocks/block_08_modulation_and_synchronization/rtl/ofdm_*.v \
              blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_tx_rx_multipath_loopback.sv
            vvp /tmp/tb_ofdm_multipath.vvp
          done

      - name: Check 16-QAM mapper and slicer
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall \
            -s tb_ofdm_qam16_mapper_demapper \
            -o /tmp/tb_ofdm_qam16_mapper_demapper.vvp \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_qam16_mapper.v \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_qam16_demapper.v \
            blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_qam16_mapper_demapper.sv
          vvp /tmp/tb_ofdm_qam16_mapper_demapper.vvp

      - name: Check time-domain CFO corrector against the fixed-point vectors
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall \
            -s tb_ofdm_cfo_corrector \
            -o /tmp/tb_ofdm_cfo_corrector.vvp \
            blocks/block_08_modulation_and_synchronization/rtl/ofdm_cfo_corrector.v \
            blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_cfo_corrector.sv
          vvp /tmp/tb_ofdm_cfo_corrector.vvp

      - name: Check 16-QAM through multipath and a 6000 ppm CFO (BER 0, EVM limits)
        run: |
          set -euo pipefail
          for case in "1 0 2" "1 6000 2" "2 6000 3"; do
            set -- $case
            iverilog -g2012 -Wall \
              -s tb_ofdm_tx_rx_qam16_loopback \
              -Ptb_ofdm_tx_rx_qam16_loopback.CHANNEL=$1 \
              -Ptb_ofdm_tx_rx_qam16_loopback.CFO_PPM=$2 \
              -Ptb_ofdm_tx_rx_qam16_loopback.EVM_LIMIT_PCT=$3 \
              -o /tmp/tb_ofdm_qam16.vvp \
              blocks/block_08_modulation_and_synchronization/rtl/ofdm_*.v \
              blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_tx_rx_qam16_loopback.sv
            vvp /tmp/tb_ofdm_qam16.vvp
          done

      - name: Check AXI4-Stream/AXI4-Lite OFDM modem wrapper
        run: |
          set -euo pipefail
          for angle in 120 -150; do
            iverilog -g2012 -Wall \
              -s tb_ofdm_axi_modem \
              -Ptb_ofdm_axi_modem.ANGLE_DEG=$angle \
              -o /tmp/tb_ofdm_axi_modem.vvp \
              blocks/block_08_modulation_and_synchronization/rtl/ofdm_*.v \
              blocks/block_08_modulation_and_synchronization/tb/tb_ofdm_axi_modem.sv
            vvp /tmp/tb_ofdm_axi_modem.vvp
          done
